services:
  # Serviço responsável por hospedar o HTML de teste localmente
  frontend:
    image: nginx:alpine
    container_name: portal_lotes_selenium
    ports:
      - '8081:80'
    volumes:
      - ./web:/usr/share/nginx/html:ro
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://localhost/login.html" ]
      interval: 5s
      retries: 5

  # Serviço de execução do bot em container
  bot-conferencia:
    build: .
    container_name: bot_selenium_run
    environment:
      # O bot acessa o Nginx pelo nome do serviço na rede do Docker
      - URL_BASE=http://frontend
      - HEADLESS=true
      - ENVIRONMENT=container
      - MAESTRO_ENABLED=false
    volumes:
      # Evidências persistidas na máquina host
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
      - ./data/output:/app/data/output
    depends_on:
      frontend:
        condition: service_healthy
