name: CI - Qualidade e Resiliência

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: .

defaults:
  run:
    shell: bash

jobs:
  testes-unitarios:
    name: Testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Preparar diretórios de evidências
        run: mkdir -p logs reports/unit

      - name: Executar testes unitários
        run: |
          set -o pipefail
          python -m pytest tests/unit \
            -v \
            --tb=short \
            --junitxml=reports/unit/junit-unitarios.xml \
            2>&1 | tee logs/testes-unitarios.log

      - name: Publicar evidências dos testes unitários
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-unitarios-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/testes-unitarios.log
            reports/unit/
          if-no-files-found: warn
          retention-days: 14

  testes-integracao:
    name: Testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Instalar Chromium e dependências do Playwright
        run: |
          python -m playwright install --with-deps chromium

      - name: Preparar diretórios de evidências
        run: mkdir -p logs reports/integration data/output screenshots/bot_web

      - name: Executar testes de integração
        env:
          HEADLESS: "true"
        run: |
          set -o pipefail
          python -m pytest tests/integration \
            --ignore=tests/integration/test_simulacao_crise.py \
            -v \
            --tb=short \
            --junitxml=reports/integration/junit-integracao.xml \
            2>&1 | tee logs/testes-integracao.log

      - name: Publicar evidências dos testes de integração
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-integracao-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/testes-integracao.log
            reports/integration/
            data/output/
            screenshots/bot_web/
          if-no-files-found: warn
          retention-days: 14
  testes-e2e:
    name: Testes E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Instalar Chromium e dependências do sistema
        run: python -m playwright install --with-deps chromium

      - name: Preparar diretórios de evidências
        run: mkdir -p logs reports/e2e screenshots data/output

      - name: Executar testes E2E
        env:
          HEADLESS: "true"
        run: |
          set -o pipefail
          python -m pytest tests/e2e \
            -v \
            --tb=short \
            --junitxml=reports/e2e/junit-e2e.xml \
            2>&1 | tee logs/testes-e2e.log

      - name: Publicar evidências dos testes E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/testes-e2e.log
            reports/e2e/
            screenshots/
            tests/e2e/screenshots/
            data/output/
          if-no-files-found: warn
          retention-days: 14

  simulacao-crise:
    name: Simulação de crise
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Preparar diretórios de evidências
        run: mkdir -p logs reports/crise data/output

      - name: Executar simulação de crise
        run: |
          set -o pipefail
          python -m pytest \
            tests/integration/test_simulacao_crise.py \
            -v \
            --tb=short \
            --junitxml=reports/crise/junit-crise.xml \
            2>&1 | tee logs/simulacao-crise.log

      - name: Publicar evidências da simulação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-crise-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/simulacao-crise.log
            reports/crise/
            data/output/
          if-no-files-found: warn
          retention-days: 14

  pacotes-maestro:
    name: Build dos bots para o Maestro
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar diretórios
        run: mkdir -p logs reports/maestro dist/maestro

      - name: Gerar pacotes dos três bots
        run: |
          set -o pipefail
          bash scripts/build_bots_maestro.sh \
            2>&1 | tee logs/build-bots-maestro.log

      - name: Validar pacotes
        run: |
          pacotes=(
            "dist/maestro/carlos_souza-entrada-v1.zip"
            "dist/maestro/carlos_souza-conferencia-v1.zip"
            "dist/maestro/carlos_souza-relatorio-v1.zip"
          )

          for pacote in "${pacotes[@]}"; do
            echo "Validando ${pacote}"

            if [ ! -f "$pacote" ]; then
              echo "Pacote não encontrado: ${pacote}"
              exit 1
            fi

            unzip -t "$pacote"

            conteudo="$(unzip -Z1 "$pacote")"

            for arquivo_obrigatorio in \
              bot.py \
              requirements.txt \
              gerar_relatorio.py; do
              if ! printf '%s\n' "$conteudo" |
                grep -qx "$arquivo_obrigatorio"; then
                echo "${arquivo_obrigatorio} ausente em ${pacote}"
                exit 1
              fi
            done

            if ! printf '%s\n' "$conteudo" |
              grep -q '^src/'; then
              echo "Diretório src ausente em ${pacote}"
              exit 1
            fi

            if printf '%s\n' "$conteudo" |
              grep -Eq '(^|/)\.env($|\.)|__pycache__|\.pyc$'; then
              echo "O pacote possui arquivos proibidos: ${pacote}"
              exit 1
            fi

            nome="$(basename "${pacote%.zip}")"

            unzip -l "$pacote" \
              > "reports/maestro/${nome}-conteudo.txt"
          done

      - name: Publicar pacotes e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacotes-maestro-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/maestro/*.zip
            logs/build-bots-maestro.log
            reports/maestro/
          if-no-files-found: warn
          retention-days: 14

  api-ml-container:
    name: Build e healthcheck da API ML
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar diretórios de evidências
        run: mkdir -p logs reports/container

      - name: Validar Docker Compose
        run: |
          docker compose config \
            > reports/container/docker-compose-config.yml

      - name: Build da API ML
        run: |
          set -o pipefail
          docker compose build api_ml \
            2>&1 | tee logs/api-ml-build.log

      - name: Iniciar API ML
        run: |
          set -o pipefail
          docker compose up -d --build api_ml \
            2>&1 | tee logs/api-ml-start.log

      - name: Aguardar healthcheck da API ML
        run: |
          container_id="$(docker compose ps -q api_ml)"

          if [ -z "$container_id" ]; then
            echo "O container da API ML não foi criado."
            exit 1
          fi

          for tentativa in $(seq 1 30); do
            status="$(
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}sem-healthcheck{{end}}' \
                "$container_id"
            )"

            echo "Tentativa ${tentativa}/30: status=${status}"
            docker compose ps api_ml

            if [ "$status" = "healthy" ]; then
              echo "API ML está healthy."
              exit 0
            fi

            if [ "$status" = "unhealthy" ]; then
              echo "API ML ficou unhealthy."
              docker compose logs --no-color api_ml
              exit 1
            fi

            sleep 2
          done

          echo "Tempo limite aguardando o healthcheck da API ML."
          docker compose logs --no-color api_ml
          exit 1

      - name: Validar resposta do endpoint health
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import urllib.request

          with urllib.request.urlopen(
              "http://localhost:8000/health",
              timeout=5,
          ) as resposta:
              dados = json.load(resposta)

          Path("reports/container/api-ml-health.json").write_text(
              json.dumps(dados, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          if dados.get("modelo_carregado") is not True:
              raise SystemExit(
                  "A API respondeu, mas o modelo não está carregado."
              )

          print("Endpoint /health confirmou modelo_carregado=true.")
          PY

      - name: Coletar logs e estado do container
        if: always()
        run: |
          docker compose ps -a \
            > reports/container/docker-compose-ps.txt \
            2>&1 || true

          docker compose logs --no-color api_ml \
            > logs/api-ml-runtime.log \
            2>&1 || true

          container_id="$(docker compose ps -q api_ml 2>/dev/null || true)"
          if [ -n "$container_id" ]; then
            docker inspect "$container_id" \
              > reports/container/api-ml-inspect.json \
              2>&1 || true
          fi

      - name: Publicar evidências da API ML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-api-ml-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            reports/container/
          if-no-files-found: warn
          retention-days: 14

      - name: Encerrar containers
        if: always()
        run: docker compose down --volumes --remove-orphans

  qualidade-aprovada:
    name: Todas as camadas aprovadas
    runs-on: ubuntu-latest
    if: always()

    needs:
      - testes-unitarios
      - testes-integracao
      - simulacao-crise
      - testes-e2e
      - api-ml-container
      - pacotes-maestro

    steps:
      - name: Verificar resultado de todas as camadas
        env:
          RESULTADO_UNITARIOS: ${{ needs.testes-unitarios.result }}
          RESULTADO_INTEGRACAO: ${{ needs.testes-integracao.result }}
          RESULTADO_CRISE: ${{ needs.simulacao-crise.result }}
          RESULTADO_E2E: ${{ needs.testes-e2e.result }}
          RESULTADO_API_ML: ${{ needs.api-ml-container.result }}
          RESULTADO_MAESTRO: ${{ needs.pacotes-maestro.result }}

        run: |
          echo "Testes unitários: ${RESULTADO_UNITARIOS}"
          echo "Testes de integração: ${RESULTADO_INTEGRACAO}"
          echo "Simulação de crise: ${RESULTADO_CRISE}"
          echo "Testes E2E: ${RESULTADO_E2E}"
          echo "API ML em container: ${RESULTADO_API_ML}"
          echo "Pacotes do Maestro: ${RESULTADO_MAESTRO}"

          falhou=0

          for resultado in \
            "$RESULTADO_UNITARIOS" \
            "$RESULTADO_INTEGRACAO" \
            "$RESULTADO_CRISE" \
            "$RESULTADO_E2E" \
            "$RESULTADO_API_ML" \
            "$RESULTADO_MAESTRO"; do

            if [ "$resultado" != "success" ]; then
              falhou=1
            fi
          done

          if [ "$falhou" -ne 0 ]; then
            echo "Uma ou mais camadas obrigatórias falharam."
            exit 1
          fi

          echo "Todas as camadas obrigatórias foram aprovadas."