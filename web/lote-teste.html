<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Lotes de Produção</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-1: #0b5f4f;
            --brand-2: #0e8a70;
            --ink: #14181f;
            --ink-soft: #5b6472;
            --line: #e3e6eb;
            --paper: #ffffff;
            --panel: #f6f7f9;
            --success: #0e8a70;
            --success-bg: #e6f5f1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            min-height: 100vh;
            background: var(--panel);
            display: flex;
            justify-content: center;
            padding: 48px 20px;
        }

        .page {
            width: 100%;
            max-width: 620px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.02em;
            color: var(--ink);
            margin-bottom: 22px;
        }

        .top-bar .dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            background: var(--brand-2);
        }

        .card {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 16px;
            overflow: hidden;
        }

        .card-head {
            padding: 28px 32px 22px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--success-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-box svg { fill: var(--brand-2); width: 22px; height: 22px; }

        .card-head h1 {
            font-family: 'Sora', sans-serif;
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .card-head p {
            font-size: 13px;
            color: var(--ink-soft);
        }

        .card-body {
            padding: 32px;
        }

        .field {
            margin-bottom: 22px;
        }

        .field label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .field label span { color: var(--brand-2); }

        .field input,
        .field select {
            width: 100%;
            border: 1px solid var(--line);
            background: var(--panel);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            color: var(--ink);
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease;
            appearance: none;
            font-family: 'Inter', sans-serif;
        }

        .field input::placeholder { color: #a6acb6; }

        .field input:focus,
        .field select:focus {
            border-color: var(--brand-2);
            background: var(--paper);
        }

        .select-wrapper { position: relative; }

        .select-wrapper::after {
            content: "";
            position: absolute;
            right: 16px;
            top: 50%;
            width: 8px;
            height: 8px;
            border-right: 2px solid var(--ink-soft);
            border-bottom: 2px solid var(--ink-soft);
            transform: translateY(-70%) rotate(45deg);
            pointer-events: none;
        }

        .status-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status-option {
            flex: 1;
            min-width: 140px;
            position: relative;
        }

        .status-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            cursor: pointer;
        }

        .status-option span {
            display: block;
            text-align: center;
            padding: 12px 10px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-soft);
            background: var(--panel);
            transition: all 0.2s ease;
        }

        .status-option input[type="radio"]:checked + span {
            border-color: var(--brand-2);
            background: var(--success-bg);
            color: var(--brand-1);
        }

        .btn-submit {
            width: 100%;
            background: var(--ink);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 9px;
            transition: background 0.2s ease;
            margin-top: 6px;
        }

        .btn-submit:hover { background: var(--brand-1); }

        .btn-submit svg { fill: white; width: 16px; height: 16px; }

        .success-box {
            display: none;
            align-items: flex-start;
            gap: 12px;
            background: var(--success-bg);
            border-left: 3px solid var(--success);
            border-radius: 4px;
            padding: 14px 16px;
            margin-top: 22px;
            animation: slideIn 0.3s ease;
        }

        .success-box.show { display: flex; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-icon { display: none; }

        .success-text h3 { font-size: 13.5px; font-weight: 700; color: var(--success); margin-bottom: 2px; }
        .success-text p { font-size: 13px; color: var(--ink); }

        @media (max-width: 480px) {
            .status-group { flex-direction: column; }
            .card-body { padding: 24px; }
            .card-head { padding: 22px 24px 18px; }
        }
    </style>
</head>
<body>

    <div class="page">
        <div class="top-bar"><span class="dot"></span> SISTEMA CORPORATIVO</div>

        <div class="card">
            <div class="card-head">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 12.2l-10-5V17l10 5 10-5V9.2l-10 5z"></path></svg>
                </div>
                <div>
                    <h1>Cadastro de Lotes de Produção</h1>
                    <p>Ambiente de Teste</p>
                </div>
            </div>

            <div class="card-body">
                <!-- Adicionado o ID formCadastro -->
                <form id="formCadastro" action="#" method="POST">

                    <div class="field">
                        <label for="lote">Número do Lote <span>*</span></label>
                        <input type="text" id="lote" placeholder="Ex.: LOTE-2025-0001" required>
                    </div>

                    <div class="field">
                        <label for="produto">Produto <span>*</span></label>
                        <div class="select-wrapper">
                            <select id="produto" required>
                                <option value="" disabled selected>Selecione um produto</option>
                                <option value="1">Produto A</option>
                                <option value="2">Produto B</option>
                            </select>
                        </div>
                    </div>

                    <div class="field">
                        <label>Status <span>*</span></label>
                        <div class="status-group">
                            <label class="status-option">
                                <input type="radio" name="status" value="pendente" checked>
                                <span>Pendente</span>
                            </label>
                            <label class="status-option">
                                <input type="radio" name="status" value="processamento">
                                <span>Em Processamento</span>
                            </label>
                            <label class="status-option">
                                <input type="radio" name="status" value="concluido">
                                <span>Concluído</span>
                            </label>
                        </div>
                    </div>

                    <!-- Botão alterado para type="submit" -->
                    <button id="enviar_processo" type="submit" class="btn-submit">
                        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                        Processar Lote
                    </button>

                </form>

                <!-- Box de Sucesso com ID adicionado -->
                <div id="mensagemSucesso" class="success-box">
                    <div class="success-icon"></div>
                    <div class="success-text">
                        <h3>Sucesso!</h3>
                        <p>Lote processado com sucesso.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script para processar o formulário e exibir o sucesso -->
    <script>
        document.getElementById('formCadastro').addEventListener('submit', function(event) {
            // Previne o comportamento padrão de recarregar a página
            event.preventDefault();

            // Adiciona a classe 'show' que muda o display de 'none' para 'flex'
            document.getElementById('mensagemSucesso').classList.add('show');

            // Opcional: Você pode resetar o formulário aqui se quiser, usando:
            // this.reset();
        });
    </script>

</body>
</html>
